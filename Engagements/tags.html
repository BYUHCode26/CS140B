<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tags</title>
</head>
<body>
    <h1>HTML Tags</h1>
    <h2>Sub Title</h2>
    <h3>Smaller</h3>
    <h4>Even Smaller</h4>
    <p>This is a paragraph of text.</p>
    <hr>
    <!-- This makes a horizontal line on your webpage. -->
    <p>Put some text here.
        Put this on a different line.
    <br>Put this on a different line.
    <!-- This makes a line breaker -->
    </p>        
    <blockquote>"We love the beginning, but we never love the end"</blockquote>
    <p>Inspiration by: Kenneth Stone III</p>
    <!-- Great for making quotes, usually paragraph quotes. -->
</body>
</html>
